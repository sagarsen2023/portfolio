document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-bot.open{transform:translateY(100%);}\n#loader-count{font-family:var(--serif);font-size:clamp(60px,10vw,130px);font-weight:300;font-style:italic;color:var(--bg);letter-spacing:-.04em;line-height:1;transition:opacity .35s;user-select:none;}\n#loader-word{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(240,235,224,.35);}\n\n/* NAV */\nnav{position:fixed;top:0;left:0;right:0;z-index:500;padding:30px 64px;display:flex;justify-content:space-between;align-items:center;transition:background .5s,backdrop-filter .5s,padding .4s,border-color .5s;border-bottom:1px solid transparent;}\nnav.scrolled{background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(24px);padding:20px 64px;border-bottom-color:var(--ink3);}\n.nav-logo{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);text-decoration:none;opacity:0;animation:fadeIn .7s ease 2.6s forwards;transition:color .5s;}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n.nav-links{display:flex;gap:44px;opacity:0;animation:fadeIn .7s ease 2.6s forwards;}\n.nav-links a{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-decoration:none;transition:color .3s;position:relative;}\n.nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--acc);transition:width .35s ease,background .5s;}\n.nav-links a:hover{color:var(--ink);}\n.nav-links a:hover::after{width:100%;}\n.nav-right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);opacity:0;animation:fadeIn .7s ease 2.6s forwards;}\n.nav-orb{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:orb 3s infinite;transition:background .5s;}\n@keyframes orb{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}\n\n/* ═══ HERO ═══ */\n#hero{min-height:100vh;position:relative;z-index:3;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;}\n\n.hero-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden;}\n.hero-ghost-text{font-family:var(--serif);font-weight:300;font-style:italic;font-size:36vw;line-height:1;letter-spacing:-.06em;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px var(--ink3);user-select:none;transform:translateY(6%);transition:-webkit-text-stroke-color .5s;}\n\n/* Abstract art canvas */\n.hero-art-abs{\n  position:absolute;right:48px;top:88px;\n  width:clamp(220px,22vw,300px);\n  aspect-ratio:3/4;\n  z-index:8;\n  clip-path:inset(50% 50% round 0px);\n  animation:irisOpen 1.1s cubic-bezier(.16,1,.3,1) 2.1s forwards;\n  overflow:visible;\n  transition:none;\n  pointer-events:auto;\n  mix-blend-mode:multiply;\n}\nbody.surface-glass .hero-art-abs{mix-blend-mode:normal;}\n:root[data-theme=\"midnight\"] .hero-art-abs,\n:root[data-theme=\"carbon\"] .hero-art-abs{mix-blend-mode:screen;}\n@keyframes irisOpen{to{clip-path:inset(0% 0% round 0px);}}\n.hero-art-abs canvas{width:100%;height:100%;display:block;}\n.hero-art-label{\n  position:absolute;bottom:-22px;left:0;right:0;\n  display:flex;justify-content:space-between;\n  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);transition:color .5s;\n}\n\n.hero-name-block{position:relative;z-index:5;padding:0 60px;}\n.name-row-1{overflow:hidden;line-height:1;}\n.name-row-2{overflow:hidden;line-height:1;text-align:right;padding-right:0;}\n\n.hero-first{display:block;font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(140px,21vw,290px);line-height:.88;letter-spacing:-.04em;clip-path:inset(0 100% 0 0);animation:wipeR 1.2s cubic-bezier(.16,1,.3,1) 1.5s forwards;color:var(--ink);transition:color .5s;}\n@keyframes wipeR{to{clip-path:inset(0 0% 0 0)}}\n.hero-second{display:inline-block;font-family:var(--sans);font-weight:800;font-size:clamp(58px,8.8vw,118px);line-height:1;letter-spacing:-.055em;clip-path:inset(0 0 0 ansparent,var(--acc));animation:drip 2.2s ease-in-out 3s infinite;transition:background .5s;}\n@keyframes drip{from{top:-60%}to{top:120%}}\n\n/* SCAN LINE */\n.hero-scanline{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);z-index:20;opacity:0;pointer-events:none;transition:background .5s;}\n\n/* THEME SWITCHER */\n#theme-sw{\n  position:fixed;bottom:36px;right:36px;z-index:6000;\n  display:flex;flex-direction:column;align-items:center;gap:10px;\n  opacity:0;animation:fadeIn .7s ease 3s forwards;\n}\n.sw-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);writing-mode:vertical-rl;transform:rotate(180deg);transition:color .5s;}\n.sw-dots{display:flex;flex-direction:column;gap:8px;}\n.sw-dot{\n  width:18px;height:18px;border-radius:50%;cursor:none;\n  border:2px solid transparent;\n  transition:transform .3s,border-color .3s;\n  position:relative;\n}\n.sw-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;}\n.sw-dot:hover{transform:scale(1.2);}\n.sw-dot.active{border-color:var(--ink);}\n.sw-dot[data-theme=\"parchment\"]::after{background:#b87048;}\n.sw-dot[data-theme=\"rouge\"]::after{background:#c4394a;}\n.sw-dot[data-theme=\"sage\"]::after{background:#3d7355;}\n.sw-dot[data-theme=\"midnight\"]::after{background:#c9a84c;}\n.sw-dot[data-theme=\"carbon\"]::after{background:#5b9cf6;}\n\n/* MARQUEE */\n.mq-bar{position:relative;z-index:3;border-top:1px solid var(--ink3);border-bottom:1px solid var(--ink3);overflow:hidden;padding:14px 0;background:var(--ink4);transition:background .5s,border-color .5s;}\n.mq-track{display:flex;white-space:nowrap;animation:mq 24s linear infinite;}\n.mq-track:hover{animation-play-state:paused;}\n@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n.mq-item{padding:0 24px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:24px;transition:c }\n.stat-label{font-size:11px;color:var(--ink2);margin-top:2px;letter-spacing:.07em;text-transform:uppercase;transition:color .5s;}\n\n/* WORK */\n.proj-table{width:100%;border-collapse:collapse;margin-top:48px;}\n.proj-row{border-top:1px solid var(--ink3);cursor:none;transition:background .3s,border-color .5s;}\n.proj-row:hover{background:var(--ink4);}\n.proj-row td{padding:30px 14px;vertical-align:middle;}\n.proj-row td:first-child{padding-left:0;width:48px;}\n.proj-row td:last-child{padding-right:0;text-align:right;width:48px;}\n.p-num{font-size:11px;color:var(--ink2);letter-spacing:.06em;transition:color .3s;}\n.proj-row:hover .p-num{color:var(--acc);}\n.p-name{font-family:var(--serif);font-size:clamp(22px,2.6vw,36px);font-weight:600;letter-spacing:-.02em;line-height:1.1;transition:color .3s;}\n.proj-row:hover .p-name{color:var(--acc);}\n.p-sub{font-size:13px;color:var(--ink2);margin-top:5px;transition:color .5s;}\n.p-tags{display:flex;gap:7px;flex-wrap:wrap;}\n.p-tag{font-size:10px;padding:3px 10px;border:1px solid var(--ink3);color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;transition:all .3s;}\n.proj-row:hover .p-tag{border-color:var(--acc);color:var(--acc);}\n.p-arr{font-size:18px;color:var(--ink3);transition:all .4s;}\n.proj-row:hover .p-arr{color:var(--acc);transform:rotate(45deg) scale(1.2);}\n\n/* STACK */\n#stack .stack-layout{display:grid;grid-template-columns:1fr 1.6fr;gap:80px;}\n.stack-intro p{font-size:16px;line-height:1.8;color:var(--ink2);margin-bottom:16px;transition:color .5s;}\n.stack-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;}\n.stack-col h4{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--ink3);transition:color .5s,border-color .5s;}\n.stack-col ul{list-style:none;}\n.stack-col li{font-family:var(--serif);font-size:21px;font-weight:300;padding:9px 0;border-bottom:1px solid var(--ink3);transition:color .3s,paddi ure to container orchestration — I own the full delivery chain.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"stack-cols reveal rd2\">\n      <div class=\"stack-col\"><h4>Frontend<\u002Fh4><ul><li>React<\u002Fli><li>Next.js<\u002Fli><li>React Native<\u002Fli><li>TypeScript<\u002Fli><\u002Ful><\u002Fdiv>\n      <div class=\"stack-col\"><h4>Backend<\u002Fh4><ul><li>Node.js<\u002Fli><li>PostgreSQL<\u002Fli><li>MongoDB<\u002Fli><li>SQL<\u002Fli><\u002Ful><\u002Fdiv>\n      <div class=\"stack-col\"><h4>DevOps<\u002Fh4><ul><li>Docker<\u002Fli><li>Kubernetes<\u002Fli><li>Expo<\u002Fli><\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section class=\"section\" id=\"contact\">\n  <span class=\"sec-num reveal\">04<\u002Fspan>\n  <h2 class=\"sec-title reveal\">Let's build<br><em>something.<\u002Fem><\u002Fh2>\n  <div class=\"contact-grid\">\n    <div class=\"reveal\">\n      <div class=\"c-label\">Get in touch<\u002Fdiv>\n      <a href=\"mailto:hi@sagarsen.dev\" class=\"contact-email\">hi@sagarsen.dev<\u002Fa>\n      <p class=\"c-desc\">Have something interesting to work on? I'm always open to the right conversation about the right project.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"soc-list reveal rd2\">\n      <a href=\"#\" class=\"soc-item\"><span class=\"soc-name\">GitHub<\u002Fspan><span class=\"soc-arr\">↗<\u002Fspan><\u002Fa>\n      <a href=\"#\" class=\"soc-item\"><span class=\"soc-name\">LinkedIn<\u002Fspan><span class=\"soc-arr\">↗<\u002Fspan><\u002Fa>\n      <a href=\"#\" class=\"soc-item\"><span class=\"soc-name\">Twitter<\u002Fspan><span class=\"soc-arr\">↗<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <span>Sagar Sen © 2025<\u002Fspan>\n  <span>Designed with intent.<\u002Fspan>\n<\u002Ffooter>\n\n<!-- TWEAKS PANEL -->\n<div id=\"tweaks-panel\">\n  <div class=\"tp-card\">\n    <div class=\"tp-header\">\n      <span class=\"tp-title\">Tweaks<\u002Fspan>\n      <button class=\"tp-close\" id=\"tp-close-btn\">✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- VOICE -->\n    <div class=\"tp-section\">\n      <span class=\"tp-section-label\">Voice — typographic character<\u002Fspan>\n      <div class=\"tp-radio-group\">\n        <button class=\"tp-radio-btn tp-active\" data-ctrl=\"voice\" data-value=\"craft\">Craft<\u002Fbutton>\n        <button class=\"tp-radio-btn\" data-ctrl=\"voice\" data-value=\"system\">System<\u002Fbutton>\n        <button class=\"tp-radio-btn\" data-ctrl=\"voice\" data-value=\"vision\">Vision<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"tp-desc\" id=\"tp-voice-desc\">Warm editorial serif. Cormorant italic meets Syne bold — handcrafted and considered.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- ENERGY -->\n    <div class=\"tp-section\">\n      <span class=\"tp-section-label\">Energy — animation intensity<\u002Fspan>\n      <div class=\"tp-slider-row\">\n        <input type=\"range\" class=\"tp-slider\" id=\"tp-energy\" min=\"1\" max=\"5\" step=\"1\" value=\"3\">\n        <span class=\"tp-slider-label\" id=\"tp-energy-label\">Balanced<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"tp-desc\" id=\"tp-energy-desc\">Controls art speed, 3D rotation, and parallax — from meditative stillness to kinetic motion.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- SURFACE -->\n    <div class=\"tp-section\">\n      <span class=\"tp-section-label\">Surface — material feel<\u002Fspan>\n      <div class=\"tp-toggle-group\">\n        <button class=\"tp-toggle-btn tp-active\" data-ctrl=\"surface\" data-value=\"parchment\">\n          Parchment<span class=\"tp-toggle-sub\">warm · tactile · grain<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"tp-toggle-btn\" data-ctrl=\"surface\" data-value=\"glass\">\n          Glass<span class=\"tp-toggle-sub\">clean · digital · light<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"d34b8a15-d8ca-4f1d-be9b-3d5b00c66979\"><\u002Fscript>\n<script>\n/* ══ THEME SYSTEM ══════════════════════════════════ */\nconst THEMES = {\n  parchment: { accR:184, accG:112, accB:72,  bg:'#f0ebe0', dark:false },\n  rouge:     { accR:196, accG:57,  accB:74,  bg:'#f5f0ed', dark:false },\n  sage:      { accR:61,  accG:115, accB:85,  bg:'#e8edea', dark:false },\n  midnight:  { accR:201, accG:168, accB:76,  bg:'#100f0d', dark:true  },\n  carbon:    { accR:91,  accG:156, accB:246, bg:'#161618', dark:true  },\n};\nlet currentTheme = 'parchment';\n\nfunction setTheme(name) {\n  currentTheme = name;\n  const root = document.documentElement;\n  root.setAttribute('data-theme', name === 'parchment' ? '' : name);\n  document.querySelectorAll('.sw-dot').forEach(d => {\n    d.classList.toggle('active', d.dataset.theme === name);\n  });\n}\n\ndocument.querySelectorAll('.sw-dot').forEach(d => {\n  d.addEventListener('click', () => setTheme(d.dataset.theme));\n});\n\n/* ══ THREE.JS ══════════════════════════════════════ */\n(function(){\n  const c = document.getElementById('canvas3d');\n  const renderer = new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});\n  renderer.setPixelRatio(Math.min(devicePixelRatio,2));\n  renderer.setClearColor(0,0);\n  const scene = new THREE.Scene();\n  const camera = new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);\n  camera.position.z = 5.5;\n  const resize = () => { renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); };\n  resize(); window.addEventListener('resize',resize);\n\n  const tk = new THREE.Mesh(new THREE.TorusKnotGeometry(1.3,.34,160,36,2,3),new THREE.MeshBasicMaterial({color:0xb87048,wireframe:true,transparent:true,opacity:.1}));\n  tk.position.set(3.8,1.6,-.5); scene.add(tk);\n  const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(.75,2),new THREE.MeshBasicMaterial({color:0x4a7a72,wireframe:true,transparent:true,opacity:.08}));\n  ico.position.set(-4.2,-1.8,-1); scene.add(ico);\n  const oct = new THREE.Mesh(new THREE.OctahedronGeometry(.5,1),new THREE.MeshBasicMaterial({color:0xb87048,wireframe:true,transparent:true,opacity:.13}));\n  oct.position.set(-2.5,2.8,-1); scene.add(oct);\n  const n=220,pos=new Float32Array(n*3);\n  for(let i=0;i<n*3;i++) pos[i]=(Math.random()-.5)*18;\n  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));\n  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xb87048,size:.022,transparent:true,opacity:.28})));\n\n  let mx=0,my=0,t=0;\n  document.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*.6;my=(e.clientY/innerHeight-.5)*.4;});\n  (function loop(){\n    requestAnimationFrame(loop); t+=.005;\n    const e = window.tweakState ? window.tweakState.energy / 3 : 1;\n    tk.rotation.x+=.003*e; tk.rotation.y+=.004*e;\n    tk.rotation.x+=(my*.4*e-tk.rotation.x)*.015;\n    tk.rotation.y+=(mx*.4*e-tk.rotation.y)*.015;\n    tk.position.y=1.6+scrollY*.003;\n    ico.rotation.x-=.003*e; ico.rotation.z+=.002*e; ico.position.y=-1.8-scrollY*.002;\n    oct.rotation.y+=.006*e; oct.rotation.x+=.004*e; oct.position.y=2.8+Math.sin(t*e)*.35;\n    renderer.render(scene,camera);\n  })();\n  setTimeout(()=>c.classList.add('ready'),2200);\n})();\n\n/* ══ LOADER ═══════════════════════════════════════ */\n(function(){\n  const count=document.getElementById('loader-count');\n  const top=document.getElementById('loader-top');\n  const bot=document.getElementById('loader-bot');\n  let n=0;\n  const tick=setInterval(()=>{\n    n=Math.min(n+Math.floor(Math.random()*10)+3,100);\n    count.textContent=n;\n    if(n>=100){\n      clearInterval(tick);\n      setTimeout(()=>{\n        count.style.opacity='0';\n        setTimeout(()=>{\n          top.classList.add('open'); bot.classList.add('open');\n          setTimeout(()=>{\n            const sl=document.getElementById('scanline');\n            sl.style.opacity='1';sl.style.transition='top .8s cubic-bezier(.16,1,.3,1)';\n            requestAnimationFrame(()=>{sl.style.top='100%';setTimeout(()=>sl.style.opacity='0',900);});\n          },200);\n        },250);\n      },280);\n    }\n  },38);\n})();\n\n/* ══ SCRAMBLE ══════════════════════════════════════ */\n(function(){\n  const el = document.getElementById('scrambleEl');\n  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@!';\n  const word = 'SEN';\n  let f = 0;\n  function run() {\n    const txt = word.split('').map((c,i) => f/2 > i ? c : chars[Math.floor(Math.random()*chars.length)]).join('');\n    el.childNodes[0].textContent = txt;\n    f++;\n    if(f/2 < word.length) requestAnimationFrame(run);\n    else el.childNodes[0].textContent = word;\n  }\n  setTimeout(run, 2100);\n})();\n\n/* ══ CURSOR ════════════════════════════════════════ */\n(function(){\n  const dot=document.getElementById('cur-dot');\n  const ring=document.getElementById('cur-ring');\n  const label=document.getElementById('cur-label');\n  let mx=0,my=0,rx=0,ry=0;\n  document.addEventListener('mousemove',e=>{\n    mx=e.clientX; my=e.clientY;\n    dot.style.left=mx+'px'; dot.style.top=my+'px';\n    label.style.left=mx+'px'; label.style.top=my+'px';\n    document.getElementById('spotlight').style.background=\n      `radial-gradient(700px at ${mx}px ${my}px,rgba(var(--acc-r,184),var(--acc-g,112),var(--acc-b,72),0.055),transparent 70%)`;\n  });\n  (function loop(){ rx+=(mx-rx)*.1; ry+=(my-ry)*.1; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(loop); })();\n  document.querySelectorAll('a,.a-tag,.stack-col li,.proj-row,.soc-item,.sw-dot').forEach(el=>{\n    el.addEventListener('mouseenter',()=>document.body.classList.add('hov-link'));\n    el.addEventListener('mouseleave',()=>document.body.classList.remove('hov-link'));\n  });\n})();\n\n/* ══ PARALLAX HERO NAME ════════════════════════════ */\n(function(){\n  const name=document.getElementById('heroName');\n  document.addEventListener('mousemove',e=>{\n    const x=(e.clientX/innerWidth-.5)*20, y=(e.clientY/innerHeight-.5)*12;\n    name.style.transform=`translate(${x*.3}px,${y*.2}px)`;\n  });\n})();\n\n/* ══ NAV SCROLL ════════════════════════════════════ */\nwindow.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>80));\n\n/* ══ MARQUEE ═══════════════════════════════════════ */\n(function(){\n  const techs=['React','Next.js','Node.js','TypeScript','React Native','Expo','MongoDB','PostgreSQL','Docker','Kubernetes','SQL'];\n  const mq=document.getElementById('mq');\n  mq.innerHTML=[...techs,...techs,...techs,...techs].map(t=>`<span class=\"mq-item\"><span class=\"mq-dot\"><\u002Fspan>${t}<\u002Fspan>`).join('');\n})();\n\n/* ══ REVEAL ════════════════════════════════════════ */\n(function(){\n  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1,rootMargin:'0px 0px -40px 0px'});\n  document.querySelectorAll('.reveal').forEach(r=>io.observe(r));\n})();\n\n/* ══ COUNT UP ══════════════════════════════════════ */\n(function(){\n  const io=new IntersectionObserver(es=>es.forEach(e=>{\n    if(!e.isIntersecting)return;\n    const el=e.target,target=parseInt(el.dataset.count);\n    let t0=null;\n    (function step(ts){if(!t0)t0=ts;const p=Math.min((ts-t0)/1600,1);const v=1-Math.pow(1-p,3);el.textContent=Math.round(v*target)+(target===3||target===20?'+':'');if(p<1)requestAnimationFrame(step);})(performance.now());\n    io.unobserve(el);\n  }),{threshold:.5});\n  document.querySelectorAll('[data-count]').forEach(n=>io.observe(n));\n})();\n\n/* ══ MAGNETIC EMAIL ═══════════════════════════════ */\ndocument.querySelectorAll('.contact-email').forEach(btn=>{\n  btn.addEventListener('mousemove',e=>{const r=btn.getBoundingClientRect();btn.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.2}px,${(e.clientY-r.top-r.height/2)*.2}px)`;});\n  btn.addEventListener('mouseleave',()=>btn.style.transform='');\n});\n\n/* ══ TWEAKS PANEL ══════════════════════════════════ */\n(function(){\n  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n    \"voice\": \"craft\",\n    \"energy\": 2,\n    \"surface\": \"glass\"\n  }/*EDITMODE-END*/;\n  let state = {...TWEAK_DEFAULTS};\n\n  const VOICE_DESCS = {\n    craft:  'Warm editorial serif. Cormorant italic meets Syne bold — handcrafted and considered.',\n    system: 'Syne takes command. Everything becomes bold, structured, precise — the language of engineering.',\n    vision: 'Scale amplified. Cormorant expands to fill the room — declarative, expressive, boundary-pushing.'\n  };\n  const ENERGY_LABELS = ['','Quiet','Gentle','Balanced','Active','Kinetic'];\n  const ENERGY_DESCS = {\n    1: 'Near-still. The art barely breathes. Meditative and refined.',\n    2: 'Slow drift. Subtle motion, easy on the eye.',\n    3: 'Balanced rhythm. Purposeful animation — present but not distracting.',\n    4: 'Active pulse. The art reacts, 3D rotates with intent.',\n    5: 'Kinetic. Everything in motion — bold, energetic, impossible to ignore.'\n  };\n\n  // Expose state for art/3D loops to read\n  window.tweakState = state;\n\n  function applyState() {\n    window.tweakState = {...state};\n    const body = document.body;\n\n    // Voice\n    body.classList.remove('voice-craft','voice-system','voice-vision');\n    body.classList.add('voice-' + state.voice);\n\n    // Surface\n    body.classList.remove('surface-parchment','surface-glass');\n    body.classList.add('surface-' + state.surface);\n\n    // Persist to host\n    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{...state}}, '*');\n  }\n\n  function updateUI() {\n    // Voice buttons\n    document.querySelectorAll('[data-ctrl=\"voice\"]').forEach(btn => {\n      btn.classList.toggle('tp-active', btn.dataset.value === state.voice);\n    });\n    document.getElementById('tp-voice-desc').textContent = VOICE_DESCS[state.voice];\n\n    // Energy\n    document.getElementById('tp-energy').value = state.energy;\n    document.getElementById('tp-energy-label').textContent = ENERGY_LABELS[state.energy];\n    document.getElementById('tp-energy-desc').textContent = ENERGY_DESCS[state.energy];\n\n    // Surface buttons\n    document.querySelectorAll('[data-ctrl=\"surface\"]').forEach(btn => {\n      btn.classList.toggle('tp-active', btn.dataset.value === state.surface);\n    });\n  }\n\n  function setKey(key, value) {\n    state[key] = value;\n    applyState();\n    updateUI();\n  }\n\n  // Voice + surface radio clicks\n  document.querySelectorAll('[data-ctrl]').forEach(btn => {\n    btn.addEventListener('click', () => setKey(btn.dataset.ctrl, btn.dataset.value));\n  });\n\n  // Energy slider\n  document.getElementById('tp-energy').addEventListener('input', function() {\n    setKey('energy', parseInt(this.value));\n  });\n\n  // Close button\n  document.getElementById('tp-close-btn').addEventListener('click', () => {\n    hidePanel();\n    window.parent.postMessage({type:'__edit_mode_dismissed'}, '*');\n  });\n\n  function showPanel() {\n    const p = document.getElementById('tweaks-panel');\n    p.style.display = 'block';\n    requestAnimationFrame(() => p.classList.add('tp-open'));\n  }\n  function hidePanel() {\n    const p = document.getElementById('tweaks-panel');\n    p.classList.remove('tp-open');\n    setTimeout(() => p.style.display = 'none', 380);\n  }\n\n  // Protocol: register listener FIRST, then announce\n  window.addEventListener('message', e => {\n    if(e.data?.type === '__activate_edit_mode')   showPanel();\n    if(e.data?.type === '__deactivate_edit_mode') hidePanel();\n  });\n  window.parent.postMessage({type:'__edit_mode_available'}, '*');\n\n  // Apply defaults silently on load\n  applyState();\n  updateUI();\n  document.getElementById('tweaks-panel').style.display = 'none';\n\n  // Make close button cursor-aware\n  document.querySelectorAll('.tp-close,.tp-radio-btn,.tp-toggle-btn,.tp-slider').forEach(el => {\n    el.addEventListener('mouseenter', () => document.body.classList.add('hov-link'));\n    el.addEventListener('mouseleave', () => document.body.classList.remove('hov-link'));\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
